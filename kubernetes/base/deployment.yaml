apiVersion: apps/v1
kind: Deployment

metadata:
  name: shipping-service
  namespace: logistic-shipping-prod
  labels:
    app.kubernetes.io/name: shipping-service
    tier: application

spec:
  replicas: 2

  selector:
    matchLabels:
      app: shipping-service

  template:
    metadata:
      labels:
        app: shipping-service

      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9102"
        prometheus.io/path: "/metrics"

    spec:
      containers:
      - name: shipping-service
        image: acrfreelogistics.azurecr.io/shipping-service:latest
        imagePullPolicy: Always

        ports:
        - name: http
          containerPort: 8080

        - name: metrics
          containerPort: 9102

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "250m"
            memory: "256Mi"

        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20