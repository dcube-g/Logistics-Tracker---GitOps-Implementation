name: Production CI Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build & Publish Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate with Azure Cloud via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate with ACR
        run: az acr login --name acrfreelogistics

      - name: Build and Push Production Container
        run: |
          IMAGE_TAG=${{ github.sha }}
          REGISTRY_URL=acrfreelogistics.azurecr.io
          docker build -t $REGISTRY_URL/shipping-service:$IMAGE_TAG .
          docker push $REGISTRY_URL/shipping-service:$IMAGE_TAG
