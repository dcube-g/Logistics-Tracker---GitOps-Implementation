apiVersion: v1
kind: Namespace
metadata:
  name: logistic-shipping-prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-service
  namespace: logistic-shipping-prod
  labels:
    app.kubernetes.io/name: shipping-service
    tier: application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shipping-service
  template:
    metadata:
      labels:
        app: shipping-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9102"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: shipping-service
        image: acrfreelogistics.azurecr.io/shipping-service:latest
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9102
          name: metrics
        resources:
          limits:
            cpu: "250m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: shipping-service-svc
  namespace: logistic-shipping-prod
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: shipping-service